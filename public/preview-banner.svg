<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="200" cy="150" r="300" fill="#38bdf8" opacity="0.08" filter="blur(60px)"/>
  <circle cx="1000" cy="450" r="300" fill="#818cf8" opacity="0.08" filter="blur(60px)"/>

  <rect x="100" y="80" width="1000" height="470" rx="20" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

  <circle cx="140" cy="120" r="7" fill="#ef4444"/>
  <circle cx="165" cy="120" r="7" fill="#f59e0b"/>
  <circle cx="190" cy="120" r="7" fill="#10b981"/>

  <text x="140" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="56" fill="#f8fafc">PALLERLA SAIRISHITH</text>
  <text x="140" y="300" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="32" fill="url(#accent)">Software / Frontend Developer</text>
  <text x="140" y="360" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">Passionate software and frontend developer focused on building clean,</text>
  <text x="140" y="395" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">responsive and user-friendly digital experiences.</text>

  <rect x="140" y="440" width="120" height="44" rx="10" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="200" y="468" font-family="monospace" font-size="16" fill="#38bdf8" text-anchor="middle">Python</text>

  <rect x="275" y="440" width="120" height="44" rx="10" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="335" y="468" font-family="monospace" font-size="16" fill="#38bdf8" text-anchor="middle">JavaScript</text>

  <rect x="410" y="440" width="120" height="44" rx="10" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="470" y="468" font-family="monospace" font-size="16" fill="#38bdf8" text-anchor="middle">HTML/CSS</text>

  <rect x="545" y="440" width="120" height="44" rx="10" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="605" y="468" font-family="monospace" font-size="16" fill="#38bdf8" text-anchor="middle">SQL</text>

  <rect x="680" y="440" width="120" height="44" rx="10" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="740" y="468" font-family="monospace" font-size="16" fill="#38bdf8" text-anchor="middle">DSA</text>
</svg>
